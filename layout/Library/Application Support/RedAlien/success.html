<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>redalien: success</title>
    <style>
        @font-face {
            font-family: 'RSansEB';
            src: url('RSansEB.ttf') format('truetype');
        }

        * { 
            -webkit-box-sizing: border-box; 
            -moz-box-sizing: border-box; 
            box-sizing: border-box; 
        }
        
        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            font-family: "Helvetica Neue", Helvetica, sans-serif;
            background-color: #1a1a1b;
            color: #d7dadc;
            overflow: hidden;
        }

        .header {
            background: -webkit-gradient(linear, left top, left bottom, color-stop(0%, #333333), color-stop(50%, #1c1c1c), color-stop(51%, #151515), color-stop(100%, #000000));
            border-bottom: 1px solid #444;
            padding: 0 10px;
            height: 50px; 
            position: absolute; top: 0; left: 0; right: 0; z-index: 10;
        }

        .logo-wrap { float: left; height: 50px; }
        .logo {
            font-family: 'RSansEB', "Helvetica Neue", Helvetica, sans-serif;
            font-size: 20px; font-weight: bold; letter-spacing: 0.3px; text-shadow: 0 -1px 0 #000; float: left; line-height: 50px; margin-left: 5px;
        }
        .logo .red { color: #FF4500; }
        .logo .alien { color: #d7dadc; }

        .content {
            position: absolute; top: 50px; bottom: 0; left: 0; right: 0;
            padding: 40px 15px; overflow-y: auto; -webkit-overflow-scrolling: touch; 
            text-align: center;
        }

        .card {
            background: rgba(0,0,0,0.3);
            border: 1px solid #333;
            border-radius: 8px; -webkit-border-radius: 8px;
            padding: 25px 15px;
            max-width: 400px;
            margin: 0 auto;
        }

        .icon {
            font-size: 48px;
            color: #4CAF50;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(76,175,80,0.4);
        }

        .title {
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 10px;
        }

        .desc {
            font-size: 14px;
            line-height: 1.4;
            color: #a8aaab;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo-wrap">
            <div class="logo"><span class="red">red</span><span class="alien">alien</span></div>
        </div>
    </div>

    <div class="content">
        <div class="card">
            <div class="icon">&#10004;</div>
            <div class="title">Authorization completed successfully</div>
            <p class="desc">You can close this tab and return to RedAlien.</p>
        </div>
    </div>

</body>
</html>
