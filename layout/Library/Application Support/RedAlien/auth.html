<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>redalien: request for permission</title>
    <style>
        @font-face {
            font-family: 'RSansEB';
            src: url('RSansEB.ttf') format('truetype');
        }

        * { 
            -webkit-box-sizing: border-box; 
            -moz-box-sizing: border-box; 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
        }
        
        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            font-family: "Helvetica Neue", Helvetica, sans-serif;
            background-color: #1a1a1b;
            color: #d7dadc;
            overflow: hidden;
        }

        .header {
            background: -webkit-gradient(linear, left top, left bottom, color-stop(0%, #333333), color-stop(50%, #1c1c1c), color-stop(51%, #151515), color-stop(100%, #000000));
            border-bottom: 1px solid #444;
            padding: 0 10px;
            height: 50px; 
            position: absolute; top: 0; left: 0; right: 0; z-index: 10;
        }

        .logo-wrap { float: left; height: 50px; }
        .logo {
            font-family: 'RSansEB', "Helvetica Neue", Helvetica, sans-serif;
            font-size: 20px; font-weight: bold; letter-spacing: 0.3px; text-shadow: 0 -1px 0 #000; float: left; line-height: 50px; margin-left: 5px;
        }
        .logo .red { color: #FF4500; }
        .logo .alien { color: #d7dadc; }

        .content {
            position: absolute; top: 50px; bottom: 0; left: 0; right: 0;
            padding: 20px 15px; overflow-y: auto; -webkit-overflow-scrolling: touch; 
            text-align: center;
        }

        .form-container { display: block; width: 100%; max-width: 400px; margin: 0 auto; }
        .desc { font-size: 14px; line-height: 1.4; color: #a8aaab; text-shadow: 0 -1px 0 rgba(0,0,0,0.8); margin-bottom: 20px; text-align: left; }

        .input-url {
            width: 100%;
            font-size: 13px; color: #fff;
            background: rgba(0, 0, 0, 0.5);
            padding: 12px;
            border-radius: 6px; -webkit-border-radius: 6px;
            border: 1px solid #444;
            margin-bottom: 15px;
            outline: none;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.8);
        }

        .submit-btn {
            width: 100%;
            height: 42px; line-height: 40px;
            font-size: 15px; font-weight: bold; color: #fff;
            background: -webkit-gradient(linear, left top, left bottom, color-stop(0%, #4a4a4a), color-stop(50%, #2b2b2b), color-stop(51%, #222222), color-stop(100%, #111111));
            border: 1px solid #000;
            border-radius: 6px; -webkit-border-radius: 6px;
            box-shadow: 0 1px 0 rgba(255,255,255,0.2), inset 0 1px 1px rgba(255,255,255,0.4);
            text-shadow: 0 -1px 0 #000;
            cursor: pointer;
        }

        .submit-btn:active {
            background: -webkit-gradient(linear, left top, left bottom, color-stop(0%, #222222), color-stop(100%, #000000));
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo-wrap">
            <div class="logo"><span class="red">red</span><span class="alien">alien</span></div>
        </div>
    </div>

    <div class="content">
        <div class="form-container">
            <p class="desc">Paste the callback URL you got from Reddit.</p>
            <form action="/submit" method="GET">
                <input type="text" name="url" class="input-url" placeholder="http://127.0.0.1..." required autocomplete="off" autocorrect="off" autocapitalize="off">
                <button type="submit" class="submit-btn">Submit</button>
            </form>
        </div>
    </div>

</body>
</html>
