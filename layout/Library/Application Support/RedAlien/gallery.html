<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        * {
            -webkit-box-sizing: border-box;
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        html, body {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: sans-serif;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
        }
        #slider-wrap {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 75px;
            overflow: hidden;
        }
        #slider {
            height: 100%;
            width: {{SLIDER_WIDTH}}%;
            -webkit-transition: -webkit-transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            -webkit-transform: translate3d(0, 0, 0);
        }
        .slide {
            float: left;
            height: 100%;
            width: {{SLIDE_WIDTH}}%;
            text-align: center;
            overflow: hidden;
        }
        .slide:before {
            content: '';
            display: inline-block;
            height: 100%;
            vertical-align: middle;
        }
        .slide img {
            max-width: 100%;
            max-height: 100%;
            vertical-align: middle;
            display: inline-block;
            -webkit-transition: -webkit-transform 0.1s linear;
            -webkit-transform: scale(1);
        }
        #thumbs-wrap {
            position: absolute;
            left: 0; right: 0; bottom: 0;
            height: 75px;
            background: #111;
            overflow-x: auto;
            overflow-y: hidden;
            padding: 7px 5px;
            white-space: nowrap;
            font-size: 0;
        }
        .thumb {
            display: inline-block;
            width: 60px;
            height: 60px;
            margin-right: 6px;
            background-size: cover;
            background-position: center;
            background-color: #333;
            opacity: 0.5;
            -webkit-transition: opacity 0.2s, border 0.2s;
        }
        .thumb.active {
            opacity: 1;
            border: 2px solid #FF4500;
        }
    </style>
</head>
<body>
    <div id="slider-wrap">
        <div id="slider">{{SLIDES_HTML}}</div>
    </div>
    <div id="thumbs-wrap">{{THUMBS_HTML}}</div>

    <script>
        document.addEventListener('touchmove', function(e) {
            e.preventDefault();
        }, false);

        var slider = document.getElementById('slider');
        var sliderWrap = document.getElementById('slider-wrap');
        var thumbsWrap = document.getElementById('thumbs-wrap');
        var thumbs = thumbsWrap.getElementsByTagName('div');
        var count = {{COUNT}};
        var currentIndex = 0;

        var startX = 0, startY = 0, deltaX = 0, isDragging = false;
        var lastTapTime = 0;
        var currentScale = 1;
        var isPinching = false;
        var startPinchDist = 0;
        var startScale = 1;

        function getDistance(t1, t2) {
            var dx = t1.clientX - t2.clientX;
            var dy = t1.clientY - t2.clientY;
            return Math.sqrt(dx * dx + dy * dy);
        }

        function resetZoom() {
            currentScale = 1;
            for (var i = 0; i < count; i++) {
                var img = document.getElementById('img-' + i);
                if (img) img.style.webkitTransform = 'scale(1)';
            }
        }

        function goToSlide(index) {
            currentIndex = index;
            resetZoom();

            slider.style.webkitTransition = '-webkit-transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
            var offset = -(currentIndex * (100 / count));
            slider.style.webkitTransform = 'translate3d(' + offset + '%, 0, 0)';

            for (var i = 0; i < thumbs.length; i++) {
                thumbs[i].className = 'thumb';
            }
            if (thumbs[currentIndex]) {
                thumbs[currentIndex].className = 'thumb active';
                var thumbLeft = thumbs[currentIndex].offsetLeft;
                thumbsWrap.scrollLeft = thumbLeft - (thumbsWrap.clientWidth / 2) + 30;
            }
        }

        sliderWrap.addEventListener('touchstart', function(e) {
            if (e.touches.length === 2) {
                isPinching = true;
                isDragging = false;
                startPinchDist = getDistance(e.touches[0], e.touches[1]);
                startScale = currentScale;
                return;
            }

            if (e.touches.length > 1) return;

            var touch = e.touches[0];
            startX = touch.clientX;
            startY = touch.clientY;
            deltaX = 0;
            isDragging = true;

            var now = new Date().getTime();
            var tapInterval = now - lastTapTime;
            if (tapInterval < 300 && tapInterval > 0) {
                var curImg = document.getElementById('img-' + currentIndex);
                currentScale = (currentScale > 1.2) ? 1 : 2.5;
                if (curImg) curImg.style.webkitTransform = 'scale(' + currentScale + ')';
                isDragging = false;
                lastTapTime = 0;
                return;
            }
            lastTapTime = now;

            if (currentScale <= 1.05) {
                slider.style.webkitTransition = 'none';
            }
        }, false);

        sliderWrap.addEventListener('touchmove', function(e) {
            if (e.touches.length === 2 && isPinching) {
                var dist = getDistance(e.touches[0], e.touches[1]);
                if (startPinchDist > 0) {
                    var scale = startScale * (dist / startPinchDist);
                    if (scale < 1) scale = 1;
                    if (scale > 4) scale = 4;
                    currentScale = scale;
                    var curImg = document.getElementById('img-' + currentIndex);
                    if (curImg) curImg.style.webkitTransform = 'scale(' + scale + ')';
                }
                return;
            }

            if (!isDragging || currentScale > 1.05) return;

            var touch = e.touches[0];
            deltaX = touch.clientX - startX;

            var percentDelta = (deltaX / sliderWrap.clientWidth) * (100 / count);
            var currentOffset = -(currentIndex * (100 / count)) + percentDelta;
            slider.style.webkitTransform = 'translate3d(' + currentOffset + '%, 0, 0)';
        }, false);

        sliderWrap.addEventListener('touchend', function(e) {
            if (isPinching) {
                if (e.touches.length < 2) isPinching = false;
                return;
            }

            if (!isDragging || currentScale > 1.05) return;
            isDragging = false;

            var threshold = sliderWrap.clientWidth * 0.15;
            if (deltaX < -threshold && currentIndex < count - 1) {
                currentIndex++;
            } else if (deltaX > threshold && currentIndex > 0) {
                currentIndex--;
            }
            goToSlide(currentIndex);
        }, false);

        thumbsWrap.addEventListener('touchmove', function(e) {
            e.stopPropagation();
        }, false);

        for (var i = 0; i < thumbs.length; i++) {
            (function(idx) {
                var thumb = thumbs[idx];
                var moved = false;
                thumb.addEventListener('touchmove', function(){ moved = true; }, false);
                thumb.addEventListener('touchend', function(e){
                    if (!moved) { goToSlide(idx); }
                    moved = false;
                }, false);
            })(i);
        }
    </script>
</body>
</html>
