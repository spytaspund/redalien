<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <style>
        * {
            -webkit-box-sizing: border-box;
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: #111111;
            color: #cccccc;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-box-pack: center;
            -webkit-box-align: center;
        }

        .container {
            width: 82%;
            max-width: 300px;
            text-align: center;
        }

        .progress-track {
            width: 100%;
            height: 16px;
            background: #1b1b1b;
            border: 1px solid #343434;
            -webkit-border-radius: 8px;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            margin-bottom: 12px;
        }

        .progress-bar {
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            width: 1%;
            background-color: #ff4b1f;

            background-image: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABQAAAAQCAYAAAAWGF8bAAAA80lEQVR42qWUTUsDMRRFz30dRBCxO6G6EaUWV/7/X9JKXRZ02YUiOvV2k4E4naTFuct83Nx3khfZfgRmwA8gDmVgAqwkvdmWJFNQAK/AFmjS5r6Uxh9sX0iybRUNJbXAEtgVEgL8pgMXtidUFKmET+DlSMoWuALuaymjm5T0DmyAs4rpN3Bj+7pkGgDZ5Ck8W2Be4hl/Vku7E3h2tz7IMzKzrvSPMTz7CUfzjIOVI3lG6T39g2cMJhzLU7VX3/Wt7Tlwm7iV+r0BVrJ9LumrZpoqeQYuUyLVPocn200tacazLWHKDafAnW0NtVKP5zr7fQa1B3D5rHADg+IMAAAAAElFTkSuQmCC");
            background-repeat: repeat;
            background-position: 0px 0px;

            -webkit-border-radius: 7px;
            border-radius: 7px;
        }

        .bar-gloss {
            position: absolute;
            top: 1px;
            left: 1px;
            right: 1px;
            height: 4px;
            background: rgba(255, 255, 255, 0.10);
            -webkit-border-radius: 6px;
            border-radius: 6px;
            z-index: 2;
        }

        .status-text {
            min-height: 28px;
            font-size: 12px;
            line-height: 16px;
            color: #969696;
            font-weight: bold;
            letter-spacing: 0.2px;
            text-shadow: 0 1px 2px #000000;
            word-wrap: break-word;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="progress-track">
            <div id="bar" class="progress-bar">
                <div class="bar-gloss"></div>
            </div>
        </div>

        <div id="status" class="status-text">Starting...</div>
    </div>

    <script type="text/javascript">
        document.addEventListener('touchmove', function(e) {
            e.preventDefault();
        }, false);

        var statusURL = "{{STATUS_URL}}";

        var statusElem = document.getElementById('status');
        var barElem = document.getElementById('bar');

        var timer = null;
        var stripeTimer = null;
        var finished = false;
        var statusLoading = false;
        var stripeOffset = 0;

        function animateStripes() {
            if (finished) return;

            stripeOffset -= 1;

            if (stripeOffset <= -20) {
                stripeOffset = 0;
            }

            barElem.style.backgroundPosition = stripeOffset + 'px 0px';
        }

        function applyData(data) {
            if (!data || finished) return;

            statusElem.innerText = data.text || 'Working...';

            var pct = Math.min(100, Math.max(0, data.progress || 0));
            barElem.style.width = pct + '%';

            if (data.error) {
                finished = true;

                if (timer) {
                    clearInterval(timer);
                }

                if (stripeTimer) {
                    clearInterval(stripeTimer);
                }

                statusElem.style.color = '#e74c3c';
                return;
            }

            if (pct >= 100) {
                finished = true;

                if (timer) {
                    clearInterval(timer);
                }

                if (stripeTimer) {
                    clearInterval(stripeTimer);
                }

                barElem.style.width = '100%';
                window.location.reload();
            }
        }

        function pollStatus() {
            if (finished || statusLoading) return;

            statusLoading = true;

            var script = document.createElement('script');

            script.src = statusURL
                + (statusURL.indexOf('?') >= 0 ? '&' : '?')
                + 't=' + new Date().getTime();

            script.onload = function() {
                statusLoading = false;

                if (window.statusData) {
                    applyData(window.statusData);
                }

                if (script.parentNode) {
                    script.parentNode.removeChild(script);
                }
            };

            script.onerror = function() {
                statusLoading = false;

                statusElem.innerText = 'Waiting for local video server...';

                if (script.parentNode) {
                    script.parentNode.removeChild(script);
                }
            };

            document.getElementsByTagName('head')[0].appendChild(script);
        }

        stripeTimer = setInterval(animateStripes, 35);
        timer = setInterval(pollStatus, 750);

        pollStatus();
    </script>
</body>
</html>
